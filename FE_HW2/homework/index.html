<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FE_HW2 — AJAX Users</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 0; padding: 20px; }
    h1 { font-size: 20px; margin-bottom: 12px; }
    .toolbar { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
    button { padding: 6px 12px; border-radius: 6px; border: 1px solid #ccc; background: #f7f7f7; cursor: pointer; }
    button:disabled { opacity: .6; cursor: not-allowed; }
    #users { border: 1px solid #e5e5e5; border-radius: 8px; overflow: hidden; }
    .row { display: grid; grid-template-columns: 40px 1fr 1fr 1fr 120px; gap: 8px; padding: 10px 12px; align-items: center; }
    .row:nth-child(odd) { background: #fafafa; }
    .head { font-weight: 700; background: #f0f3f6; }
    .actions { display: flex; gap: 8px; justify-content: flex-end; }
    input.inline { width: 100%; padding: 6px 8px; border-radius: 6px; border: 1px solid #d0d7de; }
    .spinner { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(255,255,255,.6); z-index: 9999; }
    .spinner.show { display: flex; }
    .spinner .dot { width: 10px; height: 10px; margin: 6px; border-radius: 50%; background: #0969da; animation: b 0.9s infinite alternate; }
    .spinner .dot:nth-child(2){ animation-delay: .15s }
    .spinner .dot:nth-child(3){ animation-delay: .3s }
    @keyframes b { from { transform: scale(.7); opacity: .5 } to { transform: scale(1.1); opacity: 1 } }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <h1>Users</h1>
  <div class="toolbar">
    <button id="reload">Reload</button>
  </div>
  <div id="users">
    <div class="row head"><div>ID</div><div>Name</div><div>Username</div><div>Email</div><div class="actions">Actions</div></div>
    <div id="list"></div>
  </div>

  <div id="spinner" class="spinner" aria-hidden="true" role="status">
    <div class="dot"></div><div class="dot"></div><div class="dot"></div>
  </div>

  <script src="js/index.js"></script>
</body>
</html>
